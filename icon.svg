<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E2E7"/></linearGradient>

  <g id="shape" fill="#fff" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(482 540) scale(0.92) translate(-471 -590)">
  <path d="M120 300 H196 Q226 300 234 330 L266 440" fill="none" stroke-width="60"/>
  <path d="M252 418 H820 L772 662 H330 Z" stroke-width="64"/>
  <path d="M330 690 V760 H770" fill="none" stroke-width="56"/>
  <circle cx="384" cy="858" r="54" stroke="none"/>
  <circle cx="716" cy="858" r="54" stroke="none"/></g></g>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <use href="#shape"/>
    
  </mask>

  <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="860">
    <stop offset="0" stop-color="#3A3A3F" stop-opacity="0.92"/>
    <stop offset="1" stop-color="#3A3A3F" stop-opacity="0.78"/>
  </linearGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="576.5">
    <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="light" gradientUnits="userSpaceOnUse" x1="140" y1="230" x2="880" y2="860">
    <stop offset="0" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".45" stop-color="#fff" stop-opacity=".10"/>
    <stop offset=".75" stop-color="#fff" stop-opacity=".25"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".85"/>
  </linearGradient>
  <mask id="lightMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="url(#light)"/>
  </mask>

  <!-- rim: the outer 9px band of the silhouette -->
  <filter id="rim" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
    <feMorphology in="SourceAlpha" operator="erode" radius="6" result="inner"/>
    <feComposite in="SourceAlpha" in2="inner" operator="out" result="ring"/>
    <feGaussianBlur in="ring" stdDeviation="1.2" result="ringSoft"/>
    <feFlood flood-color="#fff"/>
    <feComposite in2="ringSoft" operator="in"/>
  </filter>
  <!-- inner glow along the bottom edge, like light gathering in glass -->
  <filter id="glow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
    <feMorphology in="SourceAlpha" operator="erode" radius="20" result="inner"/>
    <feComposite in="SourceAlpha" in2="inner" operator="out" result="band"/>
    <feGaussianBlur in="band" stdDeviation="9" result="bandSoft"/>
    <feComposite in="bandSoft" in2="SourceAlpha" operator="in" result="clipped"/>
    <feFlood flood-color="#000" flood-opacity=".38"/>
    <feComposite in2="clipped" operator="in"/>
  </filter>
  <linearGradient id="glowGrad" gradientUnits="userSpaceOnUse" x1="0" y1="230" x2="0" y2="860">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="1"/>
  </linearGradient>
  <mask id="glowMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="url(#glowGrad)"/>
  </mask>
  <filter id="drop" x="-20%" y="-20%" width="140%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
    <feOffset dy="26" result="b"/>
    <feFlood flood-color="#000" flood-opacity="0.14"/>
    <feComposite in2="b" operator="in"/>
  </filter>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>

<use href="#shape" filter="url(#drop)"/>
<g mask="url(#m)">
  <rect width="1024" height="1024" fill="url(#body)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>
</g>
<g mask="url(#glowMask)"><g mask="url(#m)"><g filter="url(#glow)"><rect width="1024" height="1024" fill="#fff" mask="url(#m)"/></g></g></g>
<g mask="url(#lightMask)"><g filter="url(#rim)"><rect width="1024" height="1024" fill="#fff" mask="url(#m)"/></g></g>
</svg>