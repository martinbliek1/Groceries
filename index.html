<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v3.png">
<link rel="icon" type="image/png" href="apple-touch-icon-v3.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#F2F2F7; --bg-plain:#FFFFFF; --card:#FFFFFF; --card2:#F2F2F7;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29);
  --fill:rgba(118,118,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#007AFF; --red:#FF3B30; --green:#34C759;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(250,250,252,.86); --rim:rgba(255,255,255,.75);
  --shadow:0 10px 34px rgba(0,0,0,.13), 0 1px 3px rgba(0,0,0,.06);
  --tab-h:62px; --tab-b:max(10px, calc(env(safe-area-inset-bottom, 0px) - 12px));
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --bg-plain:#000000; --card:#1C1C1E; --card2:#2C2C2E;
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --fill:rgba(118,118,128,.24); --fill2:rgba(120,120,128,.36);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158;
    --glass:rgba(40,40,44,.6); --glass-strong:rgba(32,32,36,.88); --rim:rgba(255,255,255,.13);
    --shadow:0 10px 34px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:17px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
@supports (font: -apple-system-body){html{font:-apple-system-body}}
body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.29}
body[data-tab="list"],body[data-tab="aisles"]{background:var(--bg-plain)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--label)}
svg{display:block}
[hidden]{display:none !important}
body:not(.has-ai) .ai{display:none !important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* Navigation bar: transparent at rest, glass once the large title scrolls away */
.navbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background-color .2s,box-shadow .2s}
.navbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nb-in{max-width:600px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nb-title{font-weight:600;font-size:1rem;opacity:0;transition:opacity .15s}
.navbar.scrolled .nb-title{opacity:1}
.nb-r{justify-self:end;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.navbar.scrolled .nb-r{opacity:1;pointer-events:auto}
.lt-act{margin-left:auto;display:flex;gap:8px}
.lt-act .nb-btn{min-width:36px;height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:500}
.lt-act .nb-btn:has(svg){padding:0}
.nb-btn{min-width:44px;height:44px;padding:0 8px;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:1rem}
.nb-btn.strong{font-weight:600}
.nb-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}

main{max-width:600px;margin:0 auto;padding:calc(44px + env(safe-area-inset-top,0px)) 0 calc(var(--tab-h) + var(--tab-b) + 28px)}
.lt-row{display:flex;align-items:center;gap:10px;padding:2px 16px 0}
.lt{margin:0;font-size:2rem;line-height:1.2;font-weight:700}
.lt-sub{margin:2px 16px 0;color:var(--label2);font-size:0.882rem}

/* Search / quick add */
.search{position:relative;margin:12px 16px 0}
.search-f{display:flex;align-items:center;gap:6px;height:36px;padding:0 8px;border-radius:10px;background:var(--fill)}
.search-f svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--label2);stroke-width:2;stroke-linecap:round}
.search-f input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:max(16px,1rem);padding:0}
.search-f input::placeholder{color:var(--label2)}
.ac-list{list-style:none;margin:0;padding:0;position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:15;border-radius:14px;overflow:hidden;max-height:320px;overflow-y:auto;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--rim)}
.ac-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:10px 16px;text-align:left;position:relative}
.ac-list li + li .ac-item::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.ac-item small{color:var(--label2);font-size:0.882rem;white-space:nowrap}
.ac-item.create{color:var(--blue);justify-content:flex-start}
.ac-item.create svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;flex:none}
.ac-item:active{background:var(--fill)}

.done-bar{margin:14px 16px 0;font-size:0.882rem;color:var(--label2)}
.done-bar button{color:var(--blue);font-size:0.882rem}

/* Reminders-style plain list */
.lsec{margin-top:22px;border-radius:14px;transition:background-color .15s}
.lsec-h{margin:0 16px 4px;font-size:1.176rem;line-height:1.25;font-weight:700;color:var(--label)}
.lsec.done .lsec-h{color:var(--label3)}
.plain{list-style:none;margin:0;padding:0}
.row{position:relative;display:flex;align-items:center;min-height:44px}
.plain .row + .row::before,.group .row + .row::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep);z-index:2}
.plain .row{--inset:50px;padding-right:16px}
.tick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 0 10px 16px;text-align:left}
.mark{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--label3);display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s,border-color .15s,box-shadow .15s}
.mark svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.mark.done{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px var(--bg-plain)}
.mark.sel{border-color:var(--blue);background:var(--blue)}
.mark.sel svg{opacity:1}
.label{display:flex;flex-direction:column;min-width:0}
.name{overflow-wrap:anywhere}
.why{font-size:0.882rem;color:var(--label2);margin-top:1px}
.item .why{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:0.765rem;color:var(--label2);font-weight:600;margin-top:2px}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.got .name{color:var(--label2)}

.qty{flex:none;display:flex;align-items:center;gap:10px;margin-left:8px}
.qty-val{min-width:14px;text-align:right;font-variant-numeric:tabular-nums;color:var(--label2)}
.stepper{display:flex;align-items:center;height:32px;border-radius:9px;background:var(--fill)}
.stepper button{width:42px;height:32px;display:inline-flex;align-items:center;justify-content:center}
.stepper button svg{width:15px;height:15px;stroke:var(--label);stroke-width:2.2;stroke-linecap:round;fill:none}
.stepper i{width:.5px;height:18px;background:var(--sep)}
.capsule{flex:none;margin-left:8px;height:30px;padding:0 12px;border-radius:15px;font-size:0.882rem;font-weight:500;white-space:nowrap}
.capsule.tint{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.capsule.set{background:var(--fill);color:var(--label)}
.capsule.qtyc{min-width:44px;background:var(--fill);color:var(--label3);font-variant-numeric:tabular-nums}
.capsule.qtyc.set{color:var(--label);font-weight:600}
.info{flex:none;width:36px;height:44px;margin-left:4px;margin-right:-6px;display:inline-flex;align-items:center;justify-content:center;color:var(--blue)}
.info svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}

/* Swipe actions */
.plain .row.item{padding-right:0;overflow:hidden}
.sw-fg{position:relative;z-index:1;flex:1;min-width:0;display:flex;align-items:center;padding-right:16px;background:var(--bg-plain);touch-action:pan-y;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sw-l,.sw-r{position:absolute;top:0;bottom:0;display:flex;visibility:hidden;overflow:hidden;width:0;transition:width .32s cubic-bezier(.2,.8,.2,1)}
.row.item.drag .sw-fg,.row.item.drag .sw-l,.row.item.drag .sw-r{transition:none}
.row.item.sl .sw-l,.row.item.sr .sw-r{visibility:visible}
.sw-l{left:0;align-items:center;gap:6px;padding-left:20px;background:var(--blue);color:#fff;font-size:0.882rem;font-weight:600;white-space:nowrap}
.sw-l svg{flex:none;width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sw-r{right:0}
.sw-r button{height:100%;color:#fff;font-size:0.882rem;font-weight:500;white-space:nowrap;overflow:hidden;transition:flex-basis .2s}
.sw-edit{flex:0 0 74px;background:#8E8E93}
.sw-del{flex:1 0 74px;background:var(--red)}
.row.item.full .sw-edit{flex-basis:0}

/* Hidden actions for VoiceOver and keyboard; they appear when focused */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vh:focus-visible{position:relative;width:auto;height:auto;margin:6px 16px;padding:6px 12px;clip:auto;overflow:visible;border-radius:14px;background:var(--fill);color:var(--blue);font-size:0.882rem;z-index:3}

/* One-time tips (TipKit style) */
.tip{display:flex;align-items:flex-start;gap:12px;margin:14px 16px 0;padding:12px 10px 13px 14px;border-radius:16px;background:var(--card2)}
body[data-tab="meals"] .tip,body[data-tab="plan"] .tip{background:var(--card)}
.tip-ic{flex:none;width:30px;height:30px;margin-top:1px;fill:none;stroke:var(--blue);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tip-t{flex:1;min-width:0}
.tip-t b{display:block;font-weight:600}
.tip-t p{margin:2px 0 0;color:var(--label2);font-size:0.882rem;line-height:1.35}
.tip-x{flex:none;width:30px;height:30px;margin:-5px -4px 0 0;display:inline-flex;align-items:center;justify-content:center;color:var(--label3)}
.tip-x svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* Inset grouped lists */
.gh{margin:26px 32px 7px;font-size:0.765rem;font-weight:400;text-transform:uppercase;color:var(--label2)}
.group{list-style:none;margin:0 16px;padding:0;background:var(--card);border-radius:12px;overflow:hidden}
.group .row{padding:0 16px}
.group .row .tick{padding-left:0}
.group.meals .row{--inset:50px;padding-right:10px}
.gf{margin:7px 32px 0;font-size:0.765rem;color:var(--label2);line-height:1.38}
.row-btn{width:100%;min-height:44px;padding:11px 0;text-align:left;color:var(--blue)}
.row-btn.danger{color:var(--red)}

/* Planning: strict grid, Matin/Midi/Soir rows aligned across every day */
.plan{display:flex;margin-top:12px}
.gutter{flex:none;width:60px;padding-left:16px;display:flex;flex-direction:column;gap:8px}
.g-h{height:2.824rem}
.g-k{height:5.647rem;display:flex;align-items:center;font-size:0.765rem;font-weight:500;color:var(--label2)}
.days{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.days::-webkit-scrollbar{display:none}
.day{scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;min-width:0}
.day-h{height:2.824rem;display:flex;flex-direction:column;justify-content:flex-end;padding:0 4px 4px}
.day-h b{font-size:1rem;font-weight:600;line-height:1.2}
.day-h small{font-size:0.765rem;color:var(--label2)}
.day.today .day-h b,.day.today .day-h small{color:var(--blue)}
.cell{position:relative;height:5.647rem;width:100%;border-radius:14px;background:var(--card);padding:10px 12px;display:flex;flex-direction:column;overflow:hidden;text-align:left}
.cell-v{font-size:0.882rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cell-n{margin-top:auto;padding-top:2px;font-size:0.706rem;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.left .cell-v{color:var(--label2);font-weight:500}
.cell.left .cell-n{color:var(--label2)}
.cell.unset{align-items:center;justify-content:center}
.cell.unset svg{width:22px;height:22px;fill:none;stroke:var(--label3);stroke-width:2;stroke-linecap:round}
.cell.off{background:var(--fill);align-items:center;justify-content:center;font-size:0.765rem;color:var(--label2)}
.cell select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;cursor:pointer}
.cell:active{opacity:.7}
/* Rayons: the catalogue grouped in collapsible aisles */
#catalog{margin-top:10px}
.csec{margin-top:0;border-radius:0}
.csec-h{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;text-align:left}
.csec + .csec .csec-h::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.csec-n{flex:1;min-width:0;font-size:1.176rem;line-height:1.25;font-weight:600;color:var(--label);transition:color .25s}
.csec.open .csec-n{font-weight:700;color:var(--blue)}
.csec-c{color:var(--label2);font-size:0.882rem;font-variant-numeric:tabular-nums}
.csec-on{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:11px;background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue);font-size:0.765rem;font-weight:600;font-variant-numeric:tabular-nums}
.csec-on svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.csec-c{min-width:16px;text-align:right}
.csec-h > svg{flex:none;width:13px;height:13px;fill:none;stroke:var(--label3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.csec.open .csec-h > svg{transform:rotate(90deg)}
.csec-body{overflow:hidden;transition:height .38s cubic-bezier(.32,.72,0,1)}
.csec-body > *{transition:opacity .3s ease}
.csec-body .plain{padding-bottom:8px}
.csec-body.closing > *{opacity:0;transition-duration:.2s}
.csec-empty{margin:0 16px 6px;color:var(--label3);font-size:0.882rem}
.cat-actions{display:flex;flex-direction:column;padding:14px 16px 0}
#catalog.reorder .csec-body{display:none}
#catalog.reorder .csec{padding-bottom:0;background:var(--bg-plain)}
#catalog.reordering .csec{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
#catalog .csec.dragging{transition:none;position:relative;z-index:5;scale:1.02;border-radius:12px;background:var(--card);box-shadow:0 10px 28px rgba(0,0,0,.2)}
#catalog .csec.dragging .csec-h::before,#catalog .csec.dragging + .csec .csec-h::before{opacity:0}
#route .row,#catalog .row,#catalog .csec-h{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.row.item.lifted .sw-fg{opacity:.35}
.lsec.drop{border-radius:14px;background:color-mix(in srgb,var(--blue) 14%,transparent);outline:2px solid var(--blue);outline-offset:-2px}
.lsec.drop .sw-fg{background:transparent}

/* Haptic Touch: lifted row, blurred backdrop, context menu */
.lift{position:fixed;z-index:52;margin:0;list-style:none;pointer-events:none;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 14px 36px rgba(0,0,0,.22)}
.lift .sw-fg{background:var(--card)}
.lift .sw-l,.lift .sw-r{display:none}
.lift.ghost{z-index:40;transform-origin:center}
.cm-src{opacity:0}
#route .row.item,#catalog .row.item,#catalog .csec-h{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#route .row.item.leaving{opacity:.35;transition:opacity .4s,transform .28s cubic-bezier(.2,.8,.2,1)}
.cm-ov.pressing,.cm-pv.pressing-copy{transition:none}
.lift.pressing-copy{--p:0;border-radius:calc(var(--p) * 14px);box-shadow:0 14px 36px rgba(0,0,0,calc(var(--p) * .22));background:color-mix(in srgb,var(--card) calc(var(--p) * 100%),var(--bg-plain))}
.lift.pressing-copy .sw-fg{background:transparent}
.cm-pv{transform:scale(.965);transition:transform .5s cubic-bezier(.3,1.5,.55,1),opacity .2s}
.cm-pv.in{transform:scale(1.03)}
.cm-pv.out{transform:scale(1);opacity:0;transition:transform .22s ease-out,opacity .22s ease-in}
.cm-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.12);-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);opacity:0;transition:opacity .3s,-webkit-backdrop-filter .4s,backdrop-filter .4s}
.cm-ov.in{opacity:1;-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%)}
.cm{position:fixed;z-index:53;width:250px;border-radius:14px;overflow:hidden;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--rim);opacity:0;transform:scale(.5);transition:opacity .2s .04s,transform .5s cubic-bezier(.3,1.4,.55,1) .04s}
.cm.in{opacity:1;transform:none}
.cm.out{opacity:0;transform:scale(.7);transition:opacity .16s,transform .2s ease-in}
.cm-ov.out{opacity:0;-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:opacity .22s,-webkit-backdrop-filter .22s,backdrop-filter .22s}
.cm-i{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:11px 16px;text-align:left;font-size:1rem}
.cm-i + .cm-i::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.cm-i svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cm-i.danger{color:var(--red)}
.cm-i[disabled]{opacity:.35}
.cm-i:active{background:var(--fill)}
@media (prefers-color-scheme: dark){.cm-ov{background:rgba(0,0,0,.35)}}

/* Switches: native on iOS 17.4+, drawn elsewhere */
.sw-row label{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 0}
.sw-row .name{flex:1}
.no-switch input.sw{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background-color .2s;margin:0}
.no-switch input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.no-switch input.sw:checked{background:var(--green)}
.no-switch input.sw:checked::after{transform:translateX(20px)}

/* Empty states (ContentUnavailableView) */
.empty{text-align:center;padding:56px 32px 0}
.empty svg{width:56px;height:56px;margin:0 auto 14px;fill:none;stroke:var(--label3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty h2{margin:0 0 6px;font-size:1.294rem;font-weight:700}
.empty p{margin:0 0 16px;color:var(--label2);font-size:0.882rem;line-height:1.38}
.empty button{display:block;margin:8px auto 0;color:var(--blue);font-size:1rem}

/* Floating glass tab bar */
.tabbar{position:fixed;left:16px;right:16px;bottom:var(--tab-b);z-index:20;max-width:420px;margin:0 auto;height:var(--tab-h);border-radius:31px;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--rim),inset 0 1px 0 var(--rim);display:flex;padding:4px}

.tabbar button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--blue);background:var(--fill)}

/* Toast as a glass capsule above the tab bar */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-b) + var(--tab-h) + 12px);z-index:30;width:max-content;max-width:min(520px,calc(100% - 32px));padding:12px 18px;border-radius:22px;font-size:0.882rem;line-height:1.33;background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--rim);opacity:0;transform:translate(-50%,10px) scale(.96);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* Sheets: floating glass card, Cancel / title / OK in the header */
dialog.sheet{border:0;padding:0;margin:auto auto calc(8px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px);max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:32px;color:var(--label);background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 .5px var(--rim)}

    .sort().map(slotLabel);
}
function slotOrd(key){ var p = key.split("|"); return p[0] + ["matin","midi","soir"].indexOf(p[1]); }
function pendingPortions(){
  var out = [];
  Object.keys(state.plan).sort(function(a, b){ return slotOrd(a) < slotOrd(b) ? -1 : 1; }).forEach(function(k){
    var v = state.plan[k]; if (!v || v.left || v.one) return;
    var m = mealById(v.m); if (!m || m.serves === 1) return;
    var placed = Object.keys(state.plan).some(function(x){ var y = state.plan[x]; return y && y.left === k; });
    if (!placed) out.push({from:k, m:m});
  });
  return out;
}
function setSetting(name, on){

  var r = applyDiff(before, plannedSet()); commit();
  if (name === "linkPlan") toast(on ? "Planning lié à la liste." + (diffMsg(r) || "") : "Planning séparé : il ne touche plus à ta liste.");
  else toast(on ? "Les restes se placent automatiquement, jusqu'à 2 jours après." : "Les restes attendent dans « Portions à placer ».");
}
function clearPlan(){
  if (!Object.keys(state.plan).length && !Object.keys(state.open).length) return;
  var before = plannedSet();
  state.plan = {}; state.open = {};
  applyDiff(before, plannedSet()); commit(); toast("Planning vidé.");
}
function dropPortion(from){

  v.one = true; commit(); toast("Noté : pour un seul repas.");
}
function clearSlot(key){
  var old = state.plan[key];
  if (old && !old.left) Object.keys(state.plan).forEach(function(k){ var v = state.plan[k]; if (v && v.left === key) delete state.plan[k]; });
  delete state.plan[key];
}
function setPlan(key, val){
  if (val === "__left") return;
  var before = plannedSet();
  if (val.indexOf("__p:") === 0) {
    var from = val.slice(4), src = state.plan[from], sm = src ? mealById(src.m) : null;
    if (!sm) return;
    clearSlot(key);
    state.plan[key] = {m:src.m, left:from};
    applyDiff(before, plannedSet()); commit();
    toast("Reste de " + sm.name + " placé " + slotLabel(key) + ".");
    return;
  }
  if (val === "__close") {
    clearSlot(key); delete state.open[key];
    applyDiff(before, plannedSet()); commit();
    toast(cap(slotLabel(key)) + " : pas besoin de repas.");
    return;
  }
  clearSlot(key);
  if (!val) {
    applyDiff(before, plannedSet()); commit();
    toast("Rien de prévu " + slotLabel(key) + ".");
    return;
  }
  var m = mealById(val); if (!m) return;
  state.plan[key] = {m:val};
  var extra = "", far = null;
  if (m.serves !== 1 && !state.settings.autoLeft) extra = " 1 portion à placer : choisis-la dans un autre créneau.";
  else if (m.serves !== 1) {
    var nk = nextFreeSlot(key, LEFTOVER_DAYS);
    if (nk) { state.plan[nk] = {m:val, left:key}; extra = " Le reste est prévu " + slotLabel(nk) + "."; }
    else far = nextFreeSlot(key, 14);
  }
  var r = applyDiff(before, plannedSet()); commit();
  toast(m.name + " : " + slotLabel(key) + "." + extra + diffMsg(r));

function askOnePortion(key, m, far){

function prunePlan(){

function toggleMeal(mid){

function quickAdd(){

function matchItems(q){

  var terms = k.split(" ").filter(Boolean);

    var n = norm(i.name);
    return terms.every(function(t){ return n.indexOf(t) >= 0; });

    var as = an.indexOf(k) === 0 ? 0 : 1, bs = bn.indexOf(k) === 0 ? 0 : 1;
    if (as !== bs) return as - bs;
    return a.name.localeCompare(b.name, "fr");
  }).slice(0, 8);
}

function renderPlan(){

  var meals = state.meals.slice().sort(function(a, b){ return a.name.localeCompare(b.name, "fr", {sensitivity:"base"}); });

    var opts = '<option value=""' + (m ? "" : " selected") + ">Pas prévu</option>"
      + (closable ? '<option value="__close">' + (slot === "matin" ? "Pas besoin (petit-déj)" : "Pas besoin (au travail)") + "</option>" : "")
      + (m && v.left ? '<option value="__left" selected>Reste : ' + esc(m.name) + "</option>" : "")
      + (function(){
          var pend = pendingPortions().filter(function(pp){ return slotOrd(pp.from) < slotOrd(key); });
          return pend.length ? '<optgroup label="Portions à placer">' + pend.map(function(pp){ return '<option value="__p:' + pp.from + '">Reste : ' + esc(pp.m.name) + " (" + esc(slotLabel(pp.from)) + ")</option>"; }).join("") + "</optgroup>" : "";
        })()
      + '<optgroup label="Repas">' + meals.map(function(x){ return '<option value="' + esc(x.id) + '"' + (m && !v.left && x.id === m.id ? " selected" : "") + ">" + esc(x.name) + "</option>"; }).join("") + "</optgroup>";

  }

      + (editableSlot(d, "matin") ? slotRow(d, "matin") : offCell(d, "matin", "Matin", "Petit-déj"))

var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function toggleSection(id){
  var opening = !ui.expanded[id];
  if (opening) ui.expanded[id] = true; else delete ui.expanded[id];
  savePrefs(); renderNav();
  var sec = document.querySelector('#catalog .csec[data-aisle="' + id + '"]');
  if (!sec || reduceMotion || searchTerms().length) { renderCatalog(); return; }
  sec.classList.toggle("open", opening);
  sec.querySelector(".csec-h").setAttribute("aria-expanded", String(opening));
  var body = sec.querySelector(".csec-body");
  if (opening) {
    if (!body) {
      body = document.createElement("div"); body.className = "csec-body";
      body.innerHTML = secBody(state.items.filter(function(i){ return i.aisle === id; })
        .sort(function(x, y){ return x.name.localeCompare(y.name, "fr", {sensitivity:"base"}); }));
      sec.appendChild(body);
    }
    var h = body.scrollHeight;
    body.classList.remove("closing");
    body.style.height = "0px"; body.offsetHeight;
    body.style.height = h + "px";
    finish(body, function(){ body.style.height = ""; });
  } else if (body) {
    body.style.height = body.scrollHeight + "px"; body.offsetHeight;
    body.classList.add("closing");
    body.style.height = "0px";
    finish(body, function(){ if (!sec.classList.contains("open")) body.remove(); });
  }
}
function finish(el, fn){
  var done = false;
  function go(){ if (done) return; done = true; el.removeEventListener("transitionend", onEnd); fn(); }
  function onEnd(e){ if (e.target === el && e.propertyName === "height") go(); }
  el.addEventListener("transitionend", onEnd);
  setTimeout(go, 500);
}
function renderCatalog(){
  var out = $("#catalog"); if (!out) return;
  var terms = searchTerms(), html = "";

  state.aisles.forEach(function(a, ax){

      if (!its.length) return;
    }

    var open = terms.length > 0 || !!ui.expanded[a.id];
    var onList = its.filter(function(i){ return isNeeded(i.id); }).length;
    html += '<section class="lsec csec' + (open ? " open" : "") + '" data-aisle="' + esc(a.id) + '">'
      + '<button type="button" class="csec-h" data-act="sec-toggle" data-id="' + esc(a.id) + '" aria-expanded="' + open + '">'

      + '<span class="csec-c" aria-label="' + its.length + " " + plural(its.length, "produit", "produits") + '">' + its.length + "</span>" + ICON.chev + "</button>"
      + '<button type="button" class="vh" data-act="aisle-rename" data-id="' + esc(a.id) + '">Renommer le rayon ' + esc(a.name) + "</button>"
      + (a.id === DIVERS ? "" : '<button type="button" class="vh" data-act="aisle-delete" data-id="' + esc(a.id) + '">Supprimer le rayon ' + esc(a.name) + "</button>")
      + (ax > 0 && !terms.length ? '<button type="button" class="vh" data-act="aisle-up" data-id="' + esc(a.id) + '">Monter le rayon ' + esc(a.name) + "</button>" : "")
      + (ax < state.aisles.length - 1 && !terms.length ? '<button type="button" class="vh" data-act="aisle-down" data-id="' + esc(a.id) + '">Descendre le rayon ' + esc(a.name) + "</button>" : "")

    + '<button type="button" data-act="cat-create">Créer « ' + esc(cap($("#cq").value.trim())) + " »</button></div>";
  out.innerHTML = html;
}

function openIdeasSheet(){

  openSheet('<h2 tabindex="-1" autofocus>Des idées de repas</h2><p class="hint" id="id-status" role="status"></p><div class="ideas" id="id-list"></div>'
    + '<div class="sheet-actions"><button class="btn ghost" type="button" data-close>Fermer</button><button class="btn" type="button" id="id-more" disabled>Autres idées</button></div>',
  function(root){
    var status = root.querySelector("#id-status"), list = root.querySelector("#id-list"), more = root.querySelector("#id-more"), ideas = [];
    function draw(){
      list.innerHTML = ideas.map(function(d, ix){
        return '<article class="idea"><h3>' + esc(d.name) + "</h3><p>" + esc(d.ings.map(function(g){ return g.name; }).join(", ")) + "</p>"
          + '<button class="btn small' + (d.added ? "" : " primary") + '" type="button" data-iix="' + ix + '"' + (d.added ? " disabled" : "") + ">" + (d.added ? "Ajouté à tes repas" : "Ajouter à mes repas") + "</button></article>";
      }).join("");
    }
    list.onclick = function(e){
      var b = e.target.closest("[data-iix]"); if (!b) return;
      var d = ideas[+b.dataset.iix]; if (!d || d.added) return;
      if (state.meals.some(function(x){ return norm(x.name) === norm(d.name); })) { d.added = true; draw(); return; }
      var ids = [];
      d.ings.forEach(function(g){ var id = (g.id && itemById(g.id)) ? g.id : getOrCreateItem(g.name, g.aisle, g.staple); if (ids.indexOf(id) < 0) ids.push(id); });
      state.meals.push({id:uid("m"), name:d.name, items:ids, serves:2});
      d.added = true; commit(); draw(); toast(d.name + " ajouté à tes repas.");

function parseLines(text){

}

var LEAD_T = 76, OPEN_W = 148, sw = null, openRow = null, swallowUntil = 0;

  if (!fg) return;
  sw = {li:fg.parentNode, x0:e.clientX, y0:e.clientY, id:e.pointerId, w:fg.parentNode.offsetWidth, mode:null, x:0, lead:false, full:false};
});

  }

/* ---------- Aisle reorder: sections fold to their headers while one is dragged ---------- */
var drag = null;
function dragMove(){

  var center = d.mids[d.from] + dy, to = d.from, i;
  for (i = 0; i < d.from; i++) if (center < d.mids[i]) { to = i; break; }
  if (to === d.from) for (i = d.rows.length - 1; i > d.from; i--) if (center > d.mids[i]) { to = i; break; }
  if (to !== d.to) { d.to = to; haptic(); }
  d.rows.forEach(function(r, k){
    if (k === d.from) return;
    var s = (d.from < to && k > d.from && k <= to) ? -d.h : (to < d.from && k >= to && k < d.from) ? d.h : 0;
    r.style.transform = s ? "translateY(" + s + "px)" : "";

}

  var lb = sec.getBoundingClientRect(), first = rows[0].getBoundingClientRect(), last = rows[rows.length - 1].getBoundingClientRect();
  var dy0 = clientY - (lb.top + lb.height / 2);
  drag = {li:sec, rows:rows, from:from, to:from, h:lb.height, id:pointerId, cy:clientY, startY:clientY + window.scrollY - dy0, aisle:id,
    mids:rows.map(function(r){ var b = r.getBoundingClientRect(); return b.top + window.scrollY + b.height / 2; }),
    minDy:first.top - lb.top, maxDy:last.bottom - lb.bottom};
  sec.classList.add("dragging"); cat.classList.add("reordering");
  try { sec.setPointerCapture(pointerId); } catch (err) {}
  dragMove();
  drag.raf = requestAnimationFrame(aisleLoop);
}
function endAisleDrag(e){
  var d = drag; drag = null; cancelAnimationFrame(d.raf);
  swallowUntil = Date.now() + 400;
  var cat = $("#catalog"), fingerY = d.cy;
  cat.classList.remove("reordering", "reorder");
  d.rows.forEach(function(r){ r.style.transform = ""; });
  d.li.classList.remove("dragging");
  if (e.type !== "pointercancel" && d.to !== d.from) {
    state.aisles.splice(d.to, 0, state.aisles.splice(d.from, 1)[0]);
    commit();
  }
  var sec = cat.querySelector('.csec[data-aisle="' + d.aisle + '"]');
  if (sec) window.scrollTo(0, sec.getBoundingClientRect().top + window.scrollY - fingerY + 26);
}

/* ---------- Drag a product onto another aisle ---------- */
var idrag = null;
function itemTarget(x, y){
  var el = document.elementFromPoint(x, y);
  return (el && el.closest && el.closest("#catalog .lsec")) || null;
}
function itemMove(){
  var d = idrag;
  d.ghost.style.transform = "translate(" + (d.cx - d.x0) + "px," + (d.cy - d.y0) + "px) scale(1.03)";
  var sec = itemTarget(d.cx, d.cy);
  if (sec !== d.over) {
    if (d.over) d.over.classList.remove("drop");
    d.over = sec;
    if (sec && sec.dataset.aisle !== d.from) { sec.classList.add("drop"); haptic(); }
  }
}
function itemLoop(){
  if (!idrag) return;
  var v = edgeSpeed(idrag.cy);
  if (v) { window.scrollBy(0, v); itemMove(); }
  idrag.raf = requestAnimationFrame(itemLoop);
}
function startItemDrag(li, x0, y0, x, y, pointerId){
  var it = itemById(li.dataset.id); if (!it) return;
  var ghost = liftedCopy(li);
  ghost.classList.add("ghost");
  document.body.appendChild(ghost);
  li.classList.add("lifted");
  idrag = {li:li, id:pointerId, item:it.id, from:it.aisle, ghost:ghost, x0:x0, y0:y0, cx:x, cy:y, over:null};
  try { li.setPointerCapture(pointerId); } catch (err) {}
  itemMove();
  idrag.raf = requestAnimationFrame(itemLoop);
}
function endItemDrag(e){
  var d = idrag; idrag = null; cancelAnimationFrame(d.raf);
  swallowUntil = Date.now() + 400;
  d.ghost.remove(); d.li.classList.remove("lifted");
  if (d.over) d.over.classList.remove("drop");
  var it = itemById(d.item), to = d.over && d.over.dataset.aisle, a = to && aisleById(to);
  if (e.type !== "pointercancel" && it && a && to !== d.from) {
    it.aisle = to; commit(); toast(it.name + " déplacé dans " + a.name + ".");
  }
}

/* ---------- Haptic Touch: long press lifts the row, blurs the page and shows a context menu.
   Moving the finger while still pressing turns it into a drag, like UIKit's menu + drag interaction. ---------- */
var cm = null, lp = null, LP_MS = 480, PRESS_DELAY = 110;
function liftedCopy(el){
  var r = el.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight, c = el.cloneNode(true);
  c.removeAttribute("data-id");
  c.querySelectorAll("[data-act],[id]").forEach(function(x){ x.removeAttribute("data-act"); x.removeAttribute("id"); });
  c.classList.remove("cm-src");
  c.classList.add("lift");
  c.setAttribute("aria-hidden", "true");
  c.style.cssText = "left:" + (r.left + (r.width - w) / 2) + "px;top:" + (r.top + (r.height - h) / 2) + "px;width:" + w + "px;height:" + h + "px";
  return c;
}
function menuActions(kind, el){
  if (kind === "aisle") {
    var aid = el.closest(".csec").dataset.aisle;
    return [
      {label:"Renommer", icon:ICON.pencil, run:function(){ openAisleSheet(aid); }},
      {label:"Supprimer le rayon", icon:ICON.trash, danger:true, disabled:aid === DIVERS, run:function(){ confirmDeleteAisle(aid); }}
    ];
  }
  var id = el.dataset.id, on = isNeeded(id);
  if (kind === "list") return [
    {label:on ? "Acheté" : "Remettre sur la liste", icon:on ? ICON.checkC : ICON.plusC, run:function(){ toggleItem(id); }},
    {label:"Modifier", icon:ICON.pencil, run:function(){ openItemSheet({id:id}); }},
    {label:"Retirer de la liste", icon:ICON.minusC, danger:true, run:function(){ removeFromList(id); }}
  ];
  return [
    {label:on ? "Retirer de la liste" : "Ajouter à la liste", icon:on ? ICON.minusC : ICON.plusC, run:function(){ toggleItem(id); }},
    {label:"Modifier", icon:ICON.pencil, run:function(){ openItemSheet({id:id}); }},
    {label:"Supprimer", icon:ICON.trash, danger:true, run:function(){ confirmDelete(id); }}
  ];
}
function openMenu(kind, el, x, y, pointerId, press){
  var acts = menuActions(kind, el), r = el.getBoundingClientRect(), ov, pv;
  if (press && press.pv) {
    ov = press.ov; pv = press.pv;
    ov.classList.add("in"); ov.classList.remove("pressing");
    ov.style.opacity = ""; ov.style.backdropFilter = ""; ov.style.webkitBackdropFilter = "";
    pv.classList.remove("pressing-copy"); pv.style.transform = ""; pv.style.removeProperty("--p");
  } else {
    ov = document.createElement("div"); ov.className = "cm-ov";
    pv = liftedCopy(el); pv.classList.add("cm-pv");
    document.body.appendChild(ov); document.body.appendChild(pv);
  }
  var menu = document.createElement("div"); menu.className = "cm"; menu.setAttribute("role", "menu");
  menu.innerHTML = acts.map(function(a, i){
    return '<button type="button" role="menuitem" class="cm-i' + (a.danger ? " danger" : "") + '" data-cm="' + i + '"' + (a.disabled ? " disabled" : "") + "><span>" + esc(a.label) + "</span>" + a.icon + "</button>";
  }).join("");
  document.body.appendChild(menu);
  var mh = menu.offsetHeight, mw = menu.offsetWidth, vb = window.innerHeight - 90;
  var below = r.bottom + 10 + mh <= vb, top = below ? r.bottom + 10 : Math.max(12, r.top - 10 - mh);
  menu.style.top = top + "px";
  menu.style.left = Math.min(Math.max(12, r.left + 16), window.innerWidth - mw - 12) + "px";
  menu.style.transformOrigin = (below ? "top" : "bottom") + " left";
  el.classList.add("cm-src");
  pv.offsetHeight;
  requestAnimationFrame(function(){ ov.classList.add("in"); pv.classList.add("in"); menu.classList.add("in"); });
  haptic();
  cm = {kind:kind, el:el, acts:acts, ov:ov, pv:pv, menu:menu, pid:pointerId, x0:x, y0:y, down:true};
}
function closeMenu(handoff){
  if (!cm) return;
  var m = cm; cm = null;
  if (handoff) { m.el.classList.remove("cm-src"); m.pv.remove(); }
  [m.ov, m.pv, m.menu].forEach(function(n){ n.classList.remove("in"); n.classList.add("out"); });
  setTimeout(function(){ m.el.classList.remove("cm-src"); m.ov.remove(); m.pv.remove(); m.menu.remove(); }, 230);
}
function pressApply(l, e){
  l.e = e;
  l.pv.style.setProperty("--p", e.toFixed(3));
  l.pv.style.transform = "scale(" + (1 - 0.035 * e).toFixed(4) + ")";
  l.ov.style.opacity = e.toFixed(3);
  var f = "blur(" + (14 * e).toFixed(1) + "px) saturate(" + Math.round(100 + 20 * e) + "%)";
  l.ov.style.webkitBackdropFilter = f; l.ov.style.backdropFilter = f;
}
function pressLoop(){
  var l = lp; if (!l || !l.pv) return;
  var t = Math.min(1, (performance.now() - l.t0) / l.dur);
  pressApply(l, t * t * (3 - 2 * t));
  l.raf = requestAnimationFrame(pressLoop);
}
function startPress(l){
  l.ov = document.createElement("div"); l.ov.className = "cm-ov pressing";
  l.pv = liftedCopy(l.el); l.pv.classList.add("cm-pv", "pressing-copy");
  document.body.appendChild(l.ov); document.body.appendChild(l.pv);
  l.el.classList.add("cm-src");
  l.t0 = performance.now(); l.dur = LP_MS - PRESS_DELAY;
  pressApply(l, 0);
  l.raf = requestAnimationFrame(pressLoop);
}
function cancelLp(animate){
  if (!lp) return;
  var l = lp; lp = null;
  clearTimeout(l.timer); clearTimeout(l.pressT); cancelAnimationFrame(l.raf);
  if (!l.pv) return;
  var finished = false;
  function done(){ if (finished) return; finished = true; l.pv.remove(); l.ov.remove(); l.el.classList.remove("cm-src"); }
  if (!animate) { done(); return; }
  l.ov.style.pointerEvents = "none";
  setTimeout(done, 260);
  var from = l.e || 0, t0 = performance.now();
  (function back(){
    if (finished) return;
    var t = Math.min(1, (performance.now() - t0) / 180);
    pressApply(l, from * (1 - t) * (1 - t));
    if (t < 1) requestAnimationFrame(back); else done();
  })();
}
document.addEventListener("pointerdown", function(e){
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (cm || drag || idrag || openRow || Date.now() < swallowUntil) return;
  var t = e.target, el, kind;
  if (t.closest(".stepper,.capsule,.info,input,.sw-r,.vh")) return;
  if ((el = t.closest("#catalog .csec-h"))) kind = "aisle";
  else if ((el = t.closest("#catalog .row.item"))) kind = "item";
  else if ((el = t.closest("#route .row.item"))) kind = "list";
  else return;
  cancelLp();
  lp = {el:el, kind:kind, id:e.pointerId, x0:e.clientX, y0:e.clientY, cx:e.clientX, cy:e.clientY};
  lp.pressT = setTimeout(function(){ if (lp && lp.el === el) startPress(lp); }, PRESS_DELAY);
  lp.timer = setTimeout(function(){
    var l = lp; lp = null; if (!l) return;
    cancelAnimationFrame(l.raf);
    sw = null;
    if (l.pv) pressApply(l, 1);
    openMenu(l.kind, l.el, l.cx, l.cy, l.id, l);
  }, LP_MS);
});
document.addEventListener("pointermove", function(e){
  if (lp && e.pointerId === lp.id) {
    lp.cx = e.clientX; lp.cy = e.clientY;
    if (Math.abs(lp.cx - lp.x0) > 8 || Math.abs(lp.cy - lp.y0) > 8) cancelLp();
  }
  if (cm && cm.down && e.pointerId === cm.pid && cm.kind !== "list") {
    var dx = e.clientX - cm.x0, dy = e.clientY - cm.y0;
    if (dx * dx + dy * dy > 100 && !(cm.kind === "aisle" && searchTerms().length)) {
      var m = cm; closeMenu(true);
      if (m.kind === "item") startItemDrag(m.el, m.x0, m.y0, e.clientX, e.clientY, m.pid);
      else startAisleDrag(m.el.closest(".csec"), e.clientY, m.pid);
    }
  }
  if (drag && e.pointerId === drag.id) { drag.cy = e.clientY; dragMove(); }
  if (idrag && e.pointerId === idrag.id) { idrag.cx = e.clientX; idrag.cy = e.clientY; itemMove(); }
});
function endPointer(e){
  if (lp && e.pointerId === lp.id) cancelLp(true);
  if (cm && cm.down && e.pointerId === cm.pid) {
    cm.down = false; swallowUntil = Date.now() + 350;
    if (e.type === "pointercancel") closeMenu();
  }
  if (drag && e.pointerId === drag.id) endAisleDrag(e);
  if (idrag && e.pointerId === idrag.id) endItemDrag(e);
}
document.addEventListener("pointerup", endPointer);
document.addEventListener("pointercancel", endPointer);
document.addEventListener("touchmove", function(e){ if (drag || idrag || cm) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", function(e){ if (e.target.closest("#route .row, #catalog .row, #catalog .csec-h, .cm, .cm-ov")) e.preventDefault(); });
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && cm) closeMenu(); });

/* ---------- Events ---------- */
document.addEventListener("click", function(e){
  var mi = e.target.closest(".cm-i");
  if (mi && cm) { var act = cm.acts[+mi.dataset.cm]; closeMenu(); if (act && !act.disabled) act.run(); return; }
  if (e.target.closest(".cm-ov")) { closeMenu(); return; }
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var id = b.dataset.id;
  switch (b.dataset.act) {
    case "tab": setTab(b.dataset.tab); break;
    case "tick":
      haptic();
      if (ui.tab === "list" && !ui.showBought && isNeeded(id)) {
        var row = b.closest(".row"); row.querySelector(".mark").classList.add("done"); row.classList.add("leaving");
        setTimeout(function(){ toggleItem(id); }, 450);
      } else toggleItem(id);
      break;
    case "qty-open": openQtyStepper(id); break;
    case "qty-inc": haptic(); keepQtyOpen(); adjustQty(id, 1); focusQty("qty-inc", id); break;
    case "qty-dec": haptic(); keepQtyOpen(); adjustQty(id, -1); focusQty("qty-dec", id); break;
    case "qty-edit": openQtySheet(id); break;
    case "edit-item": if (openRow) closeRow(openRow); openItemSheet({id:id}); break;
    case "sw-remove": removeFromList(id); break;
    case "sw-delete": if (openRow) closeRow(openRow); confirmDelete(id); break;
    case "quick-add": quickAdd(); break;
    case "pick-item": pickItem(id); break;
    case "meal": haptic(); toggleMeal(id); break;
    case "edit-meal": openMealSheet(id); break;
    case "new-meal": openMealSheet(null); break;
    case "ideas": openIdeasSheet(); break;
    case "new-week": newWeek(); break;
    case "open-slot": openSlot(b.dataset.key); break;
    case "drop-portion": dropPortion(b.dataset.key); break;
    case "clear-plan": clearPlan(); break;
    case "clear-bought": bought.clear(); renderList(); break;
    case "show-bought": ui.showBought = true; savePrefs(); renderList(); break;
    case "hide-bought": ui.showBought = false; savePrefs(); renderList(); break;
    case "sec-toggle": toggleSection(id); break;
    case "toggle-all":
      if (allExpanded()) ui.expanded = {}; else state.aisles.forEach(function(a){ ui.expanded[a.id] = true; });
      savePrefs(); renderCatalog(); renderNav(); break;
    case "new-aisle": openAisleSheet(null); break;
    case "aisle-rename": openAisleSheet(id); break;
    case "aisle-delete": confirmDeleteAisle(id); break;
    case "aisle-up": moveAisleBy(id, -1); break;
    case "aisle-down": moveAisleBy(id, 1); break;
    case "tip-close": ui.tips[id] = true; savePrefs(); renderTips(); break;
    case "settings": openSettingsSheet(); break;
    case "backup": openExportSheet(); break;
    case "restore": openRestoreSheet(); break;
    case "cat-create": openItemSheet({name:cap($("#cq").value.trim())}); break;
    case "import": openImportSheet(); break;
    case "goto-meals": setTab("meals"); break;
    case "goto-all": setTab("aisles"); break;
  }
});
window.addEventListener("scroll", onScroll, {passive:true});
if (!("switch" in HTMLInputElement.prototype)) document.documentElement.classList.add("no-switch");
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "set-link") { setSetting("linkPlan", t.checked); return; }
  if (t.id === "set-auto") { setSetting("autoLeft", t.checked); return; }
  if (t.matches && t.matches("[data-plan]")) { var k = t.dataset.plan, v = t.value; t.blur(); setPlan(k, v); return; }
  if (!t.matches || !t.matches("[data-rename]")) return;
  var a = aisleById(t.dataset.rename), v = cap(t.value);
  if (!a) return;
  if (!v || v === a.name) { t.value = a.name; return; }
  a.name = v; t.blur(); commit();
});
$("#qa").addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); quickAdd(); } else if (e.key === "Escape") { hideSugg(); } });
$("#qa").addEventListener("input", renderSugg);
$("#qa").addEventListener("focus", renderSugg);
$("#qa").addEventListener("blur", function(){ setTimeout(hideSugg, 150); });
$("#cq").addEventListener("input", renderCatalog);

setSync("local");
if (prunePlan()) { state.updatedAt = Math.max(Date.now(), state.updatedAt + 1); saveLocal(); }
render();
renderNav();
document.addEventListener("visibilitychange", function(){ if (!document.hidden && prunePlan()) commit(); else if (!document.hidden) renderPlan(); });
initCloud();
initAI();
})();
</script>
</body>
