<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses — Direction C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000000; --surface:#17171A; --surface2:#1F1F23; --ink:#F4F4F5; --muted:#8E8E93; --line:#2C2C2E; --green:#32D74B;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
[hidden]{display:none !important}
.note{background:var(--surface2);color:var(--muted);font-size:.78rem;padding:9px 16px;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.top{padding:24px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:2.4rem;font-weight:800;letter-spacing:-0.02em}
.top h1.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-style:italic;font-size:2.5rem}
.top h1.script{font-family:'Allura',cursive;font-weight:400;font-size:3.4rem}
.fontpick{display:flex;gap:6px;flex:none}
.fontpick button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);font-size:.8rem;font-weight:700}
.fontpick button[aria-pressed="true"]{background:var(--ink);color:#000;border-color:var(--ink)}
.top p{margin:4px 0 0;color:var(--muted);font-size:.92rem;width:100%}
main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}

.seg{display:flex;gap:4px;background:var(--surface);border-radius:11px;padding:4px;margin:18px 0 20px}
.seg button{flex:1;padding:9px 4px;font-weight:600;font-size:.92rem;border-radius:8px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}

/* ---- Liste ---- */
.aisle-group{margin-bottom:26px}
.aisle-name{margin:0 0 10px;font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--surface2)}
.item:last-child{border-bottom:0}
.tickbox{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background-color .15s,border-color .15s}
.tickbox svg{width:13px;height:13px}
.tickbox path{fill:none;stroke:#000;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .18s ease-out}
.item.on .tickbox{background:var(--green);border-color:var(--green)}
.item.on .tickbox path{stroke-dashoffset:0}
.iname{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.item.got .iname{color:var(--muted);font-weight:400}
.why{display:block;font-size:.8rem;color:var(--muted);font-style:italic;margin-top:1px}
.qty{flex:none;display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:4px 6px}
.qty button{width:24px;height:24px;font-weight:700}
.qty span{min-width:14px;text-align:center;font-weight:600;font-size:.92rem}
.pill{flex:none;background:var(--surface2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.82rem;color:var(--muted)}
.pill.set{background:var(--green);color:#000}

/* ---- Planning ---- */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:76%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:18px -18px 0;padding:4px 18px 10px;scroll-padding:0 18px}
.day{scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:14px}
.day.today{box-shadow:0 0 0 2px var(--green) inset}
.day-h{margin-bottom:10px}
.day-h b{font-weight:700;font-size:1.08rem}
.day-h small{display:block;color:var(--muted);font-size:.78rem;margin-top:1px}
.slot{padding:10px 0;border-top:1px solid var(--surface2)}
.slot:first-of-type{border-top:0}
.slot-k{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.slot-v{font-weight:600;margin-top:3px;line-height:1.25}
.slot-left{font-size:.76rem;color:var(--green);font-weight:600;margin-top:2px;font-style:italic}

/* ---- Repas ---- */
.meals{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.meal{background:var(--surface);border-radius:14px;padding:16px}
.meal-name{font-weight:700;font-size:1.08rem;margin:0 0 8px;line-height:1.25}
.meal-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface2);border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:500;color:var(--muted)}
.meal-serves{float:right;color:var(--green);font-size:.82rem;font-weight:700}

/* ---- Nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--surface2);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;padding:13px 4px 9px;font-weight:600;font-size:.84rem;color:var(--muted)}
.nav button[aria-selected="true"]{color:var(--green)}
</style>
</head>
<body>
<div class="note">Direction C — système + un accent typographique. Prototype visuel, rien n'est sauvegardé.</div>
<div class="wrap">
  <header class="top">
    <h1 id="title" class="serif">Courses</h1>
    <div class="fontpick" role="group" aria-label="Choix du titre">
      <button type="button" data-font="serif" aria-pressed="true" aria-label="Georgia">G</button>
      <button type="button" data-font="script" aria-pressed="false" aria-label="Script">S</button>
    </div>
    <p id="summary">7 produits à acheter</p>
  </header>

  <section id="view-list">
    <div class="seg" role="group">
      <button type="button" data-tab2="route" aria-pressed="true">À acheter</button>
      <button type="button" data-tab2="all" aria-pressed="false">Catalogue</button>
    </div>
    <div id="aisles-out"></div>
  </section>

  <section id="view-plan" hidden>
    <p style="color:var(--muted);font-size:.88rem;margin:18px 0 0">Glisse pour voir les jours suivants.</p>
    <div class="days" id="days-out"></div>
  </section>

  <section id="view-meals" hidden>
    <ul class="meals" id="meals-out"></ul>
  </section>
</div>

<nav class="nav">
  <div class="nav-in" role="tablist">
    <button type="button" role="tab" data-tab="list" aria-selected="true">Liste</button>
    <button type="button" role="tab" data-tab="plan" aria-selected="false">Planning</button>
    <button type="button" role="tab" data-tab="meals" aria-selected="false">Repas</button>
  </div>
</nav>

<script>
(function(){
"use strict";
var TICK = '<svg viewBox="0 0 20 20"><path d="M3 10.5 L7.5 15.5 L17 4"/></svg>';

var AISLES = [
  {name:"Fruits", items:[
    {name:"Bananes", on:true, qty:3},
    {name:"Avocats", on:true, qty:2}
  ]},
  {name:"Légumes", items:[
    {name:"Tomates cerises", on:true, qty:2, why:"Gnocchis poêlés"},
    {name:"Courgettes", on:true, qty:3, why:"Lentilles, sauce tomate"},
    {name:"Épinards frais", on:false, got:true}
  ]},
  {name:"Viandes", items:[
    {name:"Lardons ou pancetta", on:true, pill:"200 g", why:"Gnocchis poêlés"},
    {name:"Steaks hachés", on:true, pill:null}
  ]},
  {name:"Épicerie salée", items:[
    {name:"Ail en poudre", on:true, pill:null}
  ]},
  {name:"Entretien", items:[
    {name:"Vanish Oxi Action", on:true, pill:null}
  ]}
];

var DAYS = [
  {name:"Aujourd'hui", sub:"25 oct.", today:true, slots:[
    {k:"Midi", v:"Tartines fromage frais et œufs brouillés"},
    {k:"Soir", v:"Lentilles, sauce tomate et courgettes"}
  ]},
  {name:"Demain", sub:"26 oct.", slots:[
    {k:"Midi", v:"Lentilles, sauce tomate et courgettes", left:"Reste d'hier soir"},
    {k:"Soir", v:"Gnocchis poêlés, tomates cerises, lardons et parmesan"}
  ]},
  {name:"Mercredi", sub:"28 oct.", slots:[
    {k:"Midi", v:"Gnocchis poêlés…", left:"Reste de mardi soir"},
    {k:"Soir", v:"Curry chicken naan"}
  ]}
];

var MEALS = [
  {name:"Croque pain complet, comté, jambon et champignons", tags:["Pain complet","Comté","Jambon","Champignons"], serves:2},
  {name:"Tartine pain complet, épinards, feta et tomates", tags:["Pain complet","Épinards","Feta","Tomates"], serves:2},
  {name:"Curry chicken naan", tags:["Pâte à pizza","Poulet","Curry","Crème","Fromage râpé"], serves:2},
  {name:"Shakshuka", tags:["Œufs","Sauce tomate","Poivrons","Cumin"], serves:2}
];

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function renderAisles(){
  document.getElementById("aisles-out").innerHTML = AISLES.map(function(a, ai){
    return '<div class="aisle-group"><p class="aisle-name">' + esc(a.name) + '</p>'
      + '<ul class="items">' + a.items.map(function(it, ix){
        var on = !!it.on, got = !!it.got;
        var extra = it.qty ? '<div class="qty"><button type="button" data-act="dec" data-a="'+ai+'" data-ix="'+ix+'">–</button><span>'+(it.qty||1)+'</span><button type="button" data-act="inc" data-a="'+ai+'" data-ix="'+ix+'">+</button></div>'
          : (it.pill !== undefined ? '<button type="button" class="pill'+(it.pill?' set':'')+'" data-act="pill" data-a="'+ai+'" data-ix="'+ix+'">'+(it.pill ? esc(it.pill) : '+ quantité')+'</button>' : '');
        return '<li class="item'+(on?' on':'')+(got?' got':'')+'"><button type="button" class="tickbox" data-act="tick" data-a="'+ai+'" data-ix="'+ix+'">'+TICK+'</button>'
          + '<span class="iname">'+esc(it.name)+(it.why?'<span class="why">'+esc(it.why)+'</span>':'')+'</span>'
          + extra + '</li>';
      }).join("") + "</ul></div>";
  }).join("");
}
function renderDays(){
  document.getElementById("days-out").innerHTML = DAYS.map(function(d){
    return '<div class="day'+(d.today?' today':'')+'"><div class="day-h"><b>'+esc(d.name)+'</b><small>'+esc(d.sub)+'</small></div>'
      + d.slots.map(function(s){
        return '<div class="slot"><div class="slot-k">'+esc(s.k)+'</div><div class="slot-v">'+esc(s.v)+'</div>'
          + (s.left ? '<div class="slot-left">'+esc(s.left)+'</div>' : '') + '</div>';
      }).join("") + "</div>";
  }).join("");
}
function renderMeals(){
  document.getElementById("meals-out").innerHTML = MEALS.map(function(m){
    return '<li class="meal"><span class="meal-serves">Pour '+m.serves+'</span><p class="meal-name">'+esc(m.name)+'</p>'
      + '<div class="meal-tags">' + m.tags.map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("") + "</div></li>";
  }).join("");
}

document.addEventListener("click", function(e){
  var fb = e.target.closest("[data-font]");
  if (fb) {
    document.querySelectorAll('[data-font]').forEach(function(x){ x.setAttribute("aria-pressed", String(x===fb)); });
    document.getElementById("title").className = fb.dataset.font;
    return;
  }
  var b = e.target.closest("[data-tab]");
  if (b) {
    document.querySelectorAll('[data-tab]').forEach(function(x){ x.setAttribute("aria-selected", String(x===b)); });
    ["list","plan","meals"].forEach(function(t){ document.getElementById("view-"+t).hidden = (t !== b.dataset.tab); });
    return;
  }
  var t2 = e.target.closest("[data-tab2]");
  if (t2) { document.querySelectorAll('[data-tab2]').forEach(function(x){ x.setAttribute("aria-pressed", String(x===t2)); }); return; }

  var tick = e.target.closest('[data-act="tick"]');
  if (tick) {
    var a = AISLES[+tick.dataset.a], it = a.items[+tick.dataset.ix];
    it.on = !it.on; renderAisles(); return;
  }
  var inc = e.target.closest('[data-act="inc"],[data-act="dec"]');
  if (inc) {
    var a2 = AISLES[+inc.dataset.a], it2 = a2.items[+inc.dataset.ix];
    it2.qty = Math.max(1, (it2.qty||1) + (inc.dataset.act === "inc" ? 1 : -1));
    renderAisles(); return;
  }
  var pill = e.target.closest('[data-act="pill"]');
  if (pill) {
    var a3 = AISLES[+pill.dataset.a], it3 = a3.items[+pill.dataset.ix];
    it3.pill = it3.pill ? null : "500 g";
    renderAisles(); return;
  }
});

renderAisles(); renderDays(); renderMeals();
})();
</script>
</body>
</html>
