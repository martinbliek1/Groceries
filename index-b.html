<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses — Direction B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --ink:#19180F; --muted:#7A7566; --line:#19180F; --green:#1FAE5A; --fill:#EFEBDF;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden;width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
[hidden]{display:none !important}
svg.defs{position:absolute;width:0;height:0}
.note{background:var(--ink);color:var(--bg);font-size:.78rem;padding:8px 16px;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.top{padding:26px 0 6px}
.top h1{margin:0;font-family:"Instrument Serif",serif;font-style:italic;font-size:3rem;font-weight:400;line-height:.95;position:relative;display:inline-block}
.top h1 .mark{position:absolute;left:-4px;right:-6px;bottom:6px;height:.5em;background:var(--green);opacity:.35;z-index:-1;transform:rotate(-1deg)}
.top p{margin:10px 0 0;color:var(--muted);font-size:.9rem}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

.seg{display:flex;gap:8px;margin:20px 0 4px}
.seg button{padding:8px 16px;border:2px solid var(--line);border-radius:999px;font-weight:600;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---- Liste ---- */
.route{list-style:none;margin:22px 0 0;padding:0;position:relative}
.route-line{position:absolute;left:13px;top:10px;bottom:10px;width:34px;pointer-events:none}
.stop{position:relative;padding-left:46px;margin-bottom:26px}
.dot{position:absolute;left:5px;top:3px;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:var(--bg)}
.aisle-name{margin:0 0 10px;font-weight:700;font-size:1.02rem}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.item{display:flex;align-items:center;gap:12px;padding:9px 0}
.tickbox{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;position:relative}
.tickbox svg{width:19px;height:19px;overflow:visible}
.tickbox path{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36;transition:stroke-dashoffset .3s cubic-bezier(.3,.9,.4,1)}
.item.on .tickbox path{stroke-dashoffset:0}
.item.on .tickbox{border-color:var(--green)}
.iname-wrap{flex:1;min-width:0;position:relative}
.iname{font-weight:600;overflow-wrap:anywhere}
.strike{position:absolute;left:-2px;right:-2px;top:48%;height:14px;opacity:0;transition:opacity .15s}
.strike svg{width:100%;height:100%;overflow:visible}
.item.got .iname{color:var(--muted)}
.item.got .strike{opacity:1}
.why{display:block;font-size:.8rem;color:var(--muted);font-style:italic;margin-top:1px}
.qty{flex:none;display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);font-weight:700}
.qty span{min-width:16px;text-align:center;font-weight:700}
.pill{flex:none;border:2px dashed var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.82rem}
.pill.set{border-style:solid;background:var(--fill)}

/* ---- Planning ---- */
.days{display:grid;grid-auto-flow:column;grid-auto-columns:74%;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:20px -18px 0;padding:6px 18px 10px;scroll-padding:0 18px}
.day{scroll-snap-align:start;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 0 var(--line);transform:rotate(-0.4deg)}
.day:nth-child(even){transform:rotate(0.5deg)}
.day.today{outline:2.5px solid var(--green);outline-offset:3px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.day-h b{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.4rem}
.day-h small{color:var(--muted);font-size:.74rem}
.slot{padding:9px 0;border-top:1.5px dashed var(--fill)}
.slot:first-of-type{border-top:0}
.slot-k{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.slot-v{font-weight:600;margin-top:3px;line-height:1.25}
.slot-left{font-size:.76rem;color:var(--green);font-weight:700;margin-top:2px}

/* ---- Repas ---- */
.meals{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.meal{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 0 var(--line)}
.meal-name{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;font-size:1.5rem;margin:0 0 8px;line-height:1.2}
.meal-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1.5px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:600}
.meal-serves{float:right;color:var(--green);font-size:.82rem;font-weight:700}

/* ---- Nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--fill);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;padding:14px 4px 10px;font-weight:600;font-size:.85rem;color:var(--muted)}
.nav button[aria-selected="true"]{color:var(--ink);font-family:"Instrument Serif",serif;font-style:italic;font-size:.95rem}
</style>
</head>
<body>
<svg class="defs"><filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
</filter></svg>
<div class="note">Direction B — éditorial / fait main. Prototype visuel, rien n'est sauvegardé.</div>
<div class="wrap">
  <header class="top">
    <h1><span class="mark"></span>Courses</h1>
    <p id="summary">7 produits à acheter</p>
  </header>

  <section id="view-list">
    <div class="seg" role="group">
      <button type="button" data-tab2="route" aria-pressed="true">À acheter</button>
      <button type="button" data-tab2="all" aria-pressed="false">Catalogue</button>
    </div>
    <ul class="route" id="route-out"></ul>
  </section>

  <section id="view-plan" hidden>
    <p style="color:var(--muted);font-size:.88rem;margin:20px 0 0">Glisse pour voir les jours suivants.</p>
    <div class="days" id="days-out"></div>
  </section>

  <section id="view-meals" hidden>
    <ul class="meals" id="meals-out"></ul>
  </section>
</div>

<nav class="nav">
  <div class="nav-in" role="tablist">
    <button type="button" role="tab" data-tab="list" aria-selected="true">Liste</button>
    <button type="button" role="tab" data-tab="plan" aria-selected="false">Planning</button>
    <button type="button" role="tab" data-tab="meals" aria-selected="false">Repas</button>
  </div>
</nav>

<script>
(function(){
"use strict";
var TICK = '<svg viewBox="0 0 20 20"><path filter="url(#rough)" d="M3 10.5 L7.5 15.5 L17 4"/></svg>';
var STRIKE = '<svg viewBox="0 0 100 14" preserveAspectRatio="none"><path filter="url(#rough)" d="M2 7 Q 25 2, 50 7 T 98 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';

var AISLES = [
  {name:"Fruits", items:[
    {name:"Bananes", on:true, qty:3},
    {name:"Avocats", on:true, qty:2}
  ]},
  {name:"Légumes", items:[
    {name:"Tomates cerises", on:true, qty:2, why:"Gnocchis poêlés"},
    {name:"Courgettes", on:true, qty:3, why:"Lentilles, sauce tomate"},
    {name:"Épinards frais", on:false, got:true}
  ]},
  {name:"Viandes", items:[
    {name:"Lardons ou pancetta", on:true, pill:"200 g", why:"Gnocchis poêlés"},
    {name:"Steaks hachés", on:true, pill:null}
  ]},
  {name:"Épicerie salée", items:[
    {name:"Ail en poudre", on:true, pill:null}
  ]},
  {name:"Entretien", items:[
    {name:"Vanish Oxi Action", on:true, pill:null}
  ]}
];

var DAYS = [
  {name:"Aujourd'hui", sub:"25 oct.", today:true, slots:[
    {k:"Midi", v:"Tartines fromage frais et œufs brouillés"},
    {k:"Soir", v:"Lentilles, sauce tomate et courgettes"}
  ]},
  {name:"Demain", sub:"26 oct.", slots:[
    {k:"Midi", v:"Lentilles, sauce tomate et courgettes", left:"Reste d'hier soir"},
    {k:"Soir", v:"Gnocchis poêlés, tomates cerises, lardons et parmesan"}
  ]},
  {name:"Mercredi", sub:"28 oct.", slots:[
    {k:"Midi", v:"Gnocchis poêlés…", left:"Reste de mardi soir"},
    {k:"Soir", v:"Curry chicken naan"}
  ]}
];

var MEALS = [
  {name:"Croque pain complet, comté, jambon et champignons", tags:["Pain complet","Comté","Jambon","Champignons"], serves:2},
  {name:"Tartine pain complet, épinards, feta et tomates", tags:["Pain complet","Épinards","Feta","Tomates"], serves:2},
  {name:"Curry chicken naan", tags:["Pâte à pizza","Poulet","Curry","Crème","Fromage râpé"], serves:2},
  {name:"Shakshuka", tags:["Œufs","Sauce tomate","Poivrons","Cumin"], serves:2}
];

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function renderRoute(){
  document.getElementById("route-out").innerHTML = AISLES.map(function(a, ai){
    return '<li class="stop"><span class="dot"></span><p class="aisle-name">'+esc(a.name)+'</p>'
      + '<ul class="items">' + a.items.map(function(it, ix){
        var on = !!it.on, got = !!it.got;
        var extra = it.qty ? '<div class="qty"><button type="button" data-act="dec" data-a="'+ai+'" data-ix="'+ix+'">–</button><span>'+(it.qty||1)+'</span><button type="button" data-act="inc" data-a="'+ai+'" data-ix="'+ix+'">+</button></div>'
          : (it.pill !== undefined ? '<button type="button" class="pill'+(it.pill?' set':'')+'" data-act="pill" data-a="'+ai+'" data-ix="'+ix+'">'+(it.pill ? esc(it.pill) : '+ quantité')+'</button>' : '');
        return '<li class="item'+(on?' on':'')+(got?' got':'')+'"><button type="button" class="tickbox" data-act="tick" data-a="'+ai+'" data-ix="'+ix+'">'+TICK+'</button>'
          + '<span class="iname-wrap"><span class="iname">'+esc(it.name)+(it.why?'<span class="why">'+esc(it.why)+'</span>':'')+'</span><span class="strike">'+STRIKE+'</span></span>'
          + extra + '</li>';
      }).join("") + "</ul></li>";
  }).join("");
}
function renderDays(){
  document.getElementById("days-out").innerHTML = DAYS.map(function(d){
    return '<div class="day'+(d.today?' today':'')+'"><div class="day-h"><b>'+esc(d.name)+'</b><small>'+esc(d.sub)+'</small></div>'
      + d.slots.map(function(s){
        return '<div class="slot"><div class="slot-k">'+esc(s.k)+'</div><div class="slot-v">'+esc(s.v)+'</div>'
          + (s.left ? '<div class="slot-left">'+esc(s.left)+'</div>' : '') + '</div>';
      }).join("") + "</div>";
  }).join("");
}
function renderMeals(){
  document.getElementById("meals-out").innerHTML = MEALS.map(function(m){
    return '<li class="meal"><span class="meal-serves">Pour '+m.serves+'</span><p class="meal-name">'+esc(m.name)+'</p>'
      + '<div class="meal-tags">' + m.tags.map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join("") + "</div></li>";
  }).join("");
}

document.addEventListener("click", function(e){
  var b = e.target.closest("[data-tab]");
  if (b) {
    document.querySelectorAll('[data-tab]').forEach(function(x){ x.setAttribute("aria-selected", String(x===b)); });
    ["list","plan","meals"].forEach(function(t){ document.getElementById("view-"+t).hidden = (t !== b.dataset.tab); });
    return;
  }
  var t2 = e.target.closest("[data-tab2]");
  if (t2) { document.querySelectorAll('[data-tab2]').forEach(function(x){ x.setAttribute("aria-pressed", String(x===t2)); }); return; }

  var tick = e.target.closest('[data-act="tick"]');
  if (tick) {
    var a = AISLES[+tick.dataset.a], it = a.items[+tick.dataset.ix];
    it.on = !it.on; renderRoute(); return;
  }
  var inc = e.target.closest('[data-act="inc"],[data-act="dec"]');
  if (inc) {
    var a2 = AISLES[+inc.dataset.a], it2 = a2.items[+inc.dataset.ix];
    it2.qty = Math.max(1, (it2.qty||1) + (inc.dataset.act === "inc" ? 1 : -1));
    renderRoute(); return;
  }
  var pill = e.target.closest('[data-act="pill"]');
  if (pill) {
    var a3 = AISLES[+pill.dataset.a], it3 = a3.items[+pill.dataset.ix];
    it3.pill = it3.pill ? null : "500 g";
    renderRoute(); return;
  }
});

renderRoute(); renderDays(); renderMeals();
})();
</script>
</body>
</html>
